services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 3001
      DATA_DIR: /app/data
      MYSQL_HOST: 192.168.1.151
      MYSQL_PORT: 3399
      MYSQL_USER: root
      MYSQL_PASSWORD: Amandaisawesome1!
      MYSQL_DATABASE: cc-transactions
    volumes:
      - statement-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8071:8081"
    restart: unless-stopped

volumes:
  statement-data:
